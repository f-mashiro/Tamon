            <!-- Logo 圖片 -->

            <div class="music-icon" id="musicIcon">
                <img id="music-note" src="images/2.png" alt="Music Note" width="90">

        </div>

        <nav>
            <ul>
                <li><a href="index.html">主頁</a></li>

    <main>
    <div class="card">
        <h2>故事概要</h2>
        <p>高中生歌夏全力追星本命偶像福原多聞，卻意外在家事代行工作中見到真實的他──陰沉低自尊、與舞台形象截然不同！即使如此，歌夏仍被他吸引，決心全力支持這個多面偶像，展開爆笑又心動的追星愛情喜劇。</p>
        <img src="images/4.jpg" alt="故事示意圖">
    </div>
    </main>

    <script>
        const musicIcon = document.getElementById('musicIcon');
        const bgMusic = document.getElementById('bg-music');

        musicIcon.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
            } else {
                bgMusic.pause();
            }
        });
    </script>
</body>
